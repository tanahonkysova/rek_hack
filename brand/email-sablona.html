<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{nadpis}}</title>
</head>
<body style="margin:0; padding:0; background-color:#F4F5F7;">
<!-- Pohoda Spotřebiče, šablona e-mailu zákazníkovi. Charakter A (hutná): menší nadpis, úsporné odsazení.
     Placeholdery nahrazuje flow F1: {{nadpis}} {{osloveni}} {{text}} {{cislo}} {{termin}} {{podpis}} {{paticka}}
     Cestu k logu (src="logo.png") nahradí část 3 odkazem na logo nahrané do SharePointu (_sablony). -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F4F5F7;">
  <tr>
    <td align="center" style="padding:16px 8px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:600px; background-color:#FFFFFF; border:1px solid #D5DAE0; border-radius:4px;">
        <tr>
          <td style="padding:14px 24px; border-bottom:4px solid #8A1538;">
            <img src="logo.png" alt="Pohoda Spotřebiče" width="117" height="40" style="display:block; border:0; height:40px; width:auto;">
          </td>
        </tr>
        <tr>
          <td style="padding:18px 24px 6px 24px; font-family:'Nunito Sans','Segoe UI',Arial,sans-serif; color:#1E252C;">
            <h1 style="margin:0 0 12px 0; font-size:20px; line-height:26px; font-weight:800; color:#8A1538;">{{nadpis}}</h1>
            <p style="margin:0 0 10px 0; font-size:15px; line-height:22px;">{{osloveni}}</p>
            <p style="margin:0 0 14px 0; font-size:15px; line-height:22px;">{{text}}</p>
          </td>
        </tr>
        <tr>
          <td style="padding:0 24px 16px 24px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F4F5F7; border-left:4px solid #E8B04A; border-radius:4px;">
              <tr>
                <td style="padding:10px 14px; font-family:'Nunito Sans','Segoe UI',Arial,sans-serif; font-size:15px; line-height:22px; color:#1E252C;">
                  <strong style="font-size:17px; color:#2F3A45;"><span style="white-space:nowrap;">{{cislo}}</span></strong>
                  <span style="color:#5A6470;">&nbsp;·&nbsp;do {{termin}}</span>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:0 24px 18px 24px; font-family:'Nunito Sans','Segoe UI',Arial,sans-serif; font-size:15px; line-height:22px; color:#1E252C;">
            {{podpis}}
          </td>
        </tr>
        <tr>
          <td style="padding:12px 24px; background-color:#2F3A45; border-radius:0 0 4px 4px; font-family:'Nunito Sans','Segoe UI',Arial,sans-serif; font-size:12px; line-height:18px; color:#FFFFFF;">
            {{paticka}}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
